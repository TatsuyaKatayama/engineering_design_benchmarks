name: Precision Arm Benchmark

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "precision_arm_benchmark/**"
      - ".github/workflows/precision-arm-benchmark.yml"
  pull_request:
    paths:
      - "precision_arm_benchmark/**"
      - ".github/workflows/precision-arm-benchmark.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: precision_arm_benchmark

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests
